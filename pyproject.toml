[project]
name = "finetune-kit"
version = "0.1.0"
description = "Noise-aware fine-tuning research CLI for BERT-family encoders"
requires-python = ">=3.12"
dependencies = [
  "typer",
  "pydantic>=2",
  "pyyaml",
  "numpy",
  "scikit-learn",
  "seqeval",
  "torch>=2.3",
  "transformers>=5.20",
  "peft",
  "pytorch-crf",
  "pyarrow>=26.0.1",
]

[project.scripts]
finetune-kit = "finetune_kit.cli:app"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finetune_kit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: needs a downloaded HF model"]
