# Shipped model profiles. Revisions are pinned commit shas.

ultrabert-150m:
  hf_id: dmis-lab/UltraBERT-150M
  revision: 545ac9d9c7aece444f014ada5a1e9818132b4d35
  tasks: [seq-cls, token-cls]
  lr_default: 8e-5
  lr_range: [2e-5, 1.5e-4]
  max_len: 512
  batch: 8
  micro: 4
  force_fp32_on_mps: false
  grad_checkpointing: false
  trust_remote_code: true
  dropout_keys: {hidden: [], attn: [attention_dropout]}
  lora_targets: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  notes: "custom architecture (trust_remote_code); config has no hidden dropout, only attention_dropout"

